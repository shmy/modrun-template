[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "main.rs"

[features]
default = ["cache-pg", "blob-cos", "job-queue-pg", "otlp"]
cache-pg = ["cache/pg"]
cache-redb = ["cache/redb"]
cache-redis = ["cache/redis"]
blob-cos = ["blob/cos", "web_state/blob-cos"]
blob-fs = ["blob/fs", "web_state/blob-fs"]
job-queue-pg = ["job_queue/pg", "web_state/job-queue-pg"]
job-queue-sqlite = ["job_queue/sqlite", "web_state/job-queue-sqlite"]
# 关闭：`cargo build -p server --no-default-features --features cache-pg,blob-cos,job-queue-pg`
otlp = ["trace_kit/otlp", "identity/otel", "http_server/otel"]

[lints]
workspace = true

[dependencies]
config = { workspace = true }
file = { workspace = true }
health = { workspace = true }
http_server = { workspace = true }
identity = { workspace = true }
cache = { workspace = true }
blob = { workspace = true }
blob_kit = { workspace = true }
chrono = { workspace = true }
file_contract = { workspace = true }
job_queue = { workspace = true }
job_queue_kit = { workspace = true }
persistence = { workspace = true }
scheduler = { workspace = true }
web_state = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
modrun = { workspace = true }
trace_kit = { workspace = true }
mimalloc = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
blob_kit = { workspace = true, features = ["test-utils"] }
toml = { workspace = true }
