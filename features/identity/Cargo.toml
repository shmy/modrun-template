[package]
name = "identity"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# 无 default：单独 check/test 由 just lint/ai-check 显式传 `--features blob-fs`
# （web_state 的 Blob 需要 fs 或 cos；server 经 workspace default-features=false 引入）
default = []
# 由 server feature `otlp` 开启；单独测 identity 可不带 metrics
otel = ["dep:trace_kit", "trace_kit/otlp"]
blob-fs = ["web_state/blob-fs"]
blob-cos = ["web_state/blob-cos"]

[dependencies]
argon2 = { workspace = true }
axum = { workspace = true }
authn_kit = { workspace = true }
config = { workspace = true }
http_auth = { workspace = true }
http_extractors = { workspace = true }
http_routing = { workspace = true }
identity_contract = { workspace = true }
jwt_kit = { workspace = true }
cache_kit = { workspace = true }
locale = { workspace = true }
modrun = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
shared_contract = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
trace_kit = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
validify = { workspace = true }
web_error = { workspace = true }
web_state = { workspace = true }

[dev-dependencies]
migration = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
