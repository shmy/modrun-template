[package]
name = "trace_kit"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
trace_id = ["dep:opentelemetry", "dep:tracing", "dep:tracing-opentelemetry"]
init = ["dep:tracing-subscriber"]
console = ["init"]
# metrics API 随 otlp 一并启用（无 exporter 时 global meter 为 noop）
otlp = [
    "init",
    "dep:tonic",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:serde_json",
]

[dependencies]
http_1 = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rootcause = { workspace = true }
rootcause-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }

tracing-subscriber = { workspace = true, optional = true }
