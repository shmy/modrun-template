[package]
name = "cache"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["pg"]
pg = ["cache_kit/pg"]
redb = ["cache_kit/redb"]
