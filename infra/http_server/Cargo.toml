[package]
name = "http_server"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# 无 default；server 以 default-features = false 引入。
# 本 crate 只读 pool（路由聚合 / CORS / 超时），不需要 blob 或队列后端；
# 曾透传 blob-fs/blob-cos 到 web_state/http_routing/http_auth，现已无消费者。
default = []
# 由 server feature `otlp` 开启；限流 metrics 经 http_routing/otel → trace_kit
otel = [
    "dep:axum-tracing-opentelemetry",
    "http_routing/otel",
]

[dependencies]
modrun = { workspace = true }
axum = { workspace = true }
axum-tracing-opentelemetry = { workspace = true, optional = true }
config = { workspace = true }
http_auth = { workspace = true }
http_routing = { workspace = true }
locale = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
web_state = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
web_error = { workspace = true }
