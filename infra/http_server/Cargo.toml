[package]
name = "http_server"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# 单独 check 时激活 Blob；server 以 default-features = false 引入
default = ["dev-blob"]
dev-blob = ["web_state/blob-fs", "http_routing/dev-blob", "http_auth/dev-blob"]
# 由 server feature `otlp` 开启；限流 metrics 经 http_routing/otel → trace_kit
otel = [
    "dep:axum-tracing-opentelemetry",
    "http_routing/otel",
]

[dependencies]
modrun = { workspace = true }
axum = { workspace = true }
axum-tracing-opentelemetry = { workspace = true, optional = true }
config = { workspace = true }
http_auth = { workspace = true }
http_routing = { workspace = true }
locale = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
web_state = { workspace = true }
