[package]
name = "web_state"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["job-queue-pg"]
job-queue-pg = ["job_queue_kit/pg"]
job-queue-sqlite = ["job_queue_kit/sqlite"]
# 由 server 的 blob-cos / blob-fs 或下游 `dev-blob` 打开；勿进 default。
# 单独 `cargo check -p web_state`：加 `--features blob-fs`（或 blob-cos）；`just ai-check web_state` 已处理。
blob-fs = ["blob_kit/fs"]
blob-cos = ["blob_kit/cos"]

[dependencies]
blob_kit = { workspace = true }
cache_kit = { workspace = true }
config = { workspace = true }
http_extractors = { workspace = true }
job_queue_kit = { workspace = true }
jwt_kit = { workspace = true }
modrun = { workspace = true }
sqlx = { workspace = true }
