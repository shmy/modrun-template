[package]
name = "web_state"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["job-queue-pg"]
job-queue-pg = ["job_queue_kit/pg"]
job-queue-sqlite = ["job_queue_kit/sqlite"]
# 由 server 的 blob-cos / blob-fs 或 just lint/ai-check 显式打开；勿进 default。
blob-fs = ["blob_kit/fs"]
blob-cos = ["blob_kit/cos"]

[dependencies]
blob_kit = { workspace = true }
cache_kit = { workspace = true }
config = { workspace = true }
http_extractors = { workspace = true }
job_queue_kit = { workspace = true }
jwt_kit = { workspace = true }
modrun = { workspace = true }
sqlx = { workspace = true }
