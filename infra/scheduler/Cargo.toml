[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = []
# scheduler 的 `HasJobBus` 实现读 `WebState.jobs`，故必须选中一种队列后端；
# 同时把 job_queue_kit 后端打开（本 crate 直接依赖它，不能只靠 web_state 透传）。
job-queue-pg = ["web_state/job-queue-pg", "job_queue_kit/pg"]
job-queue-sqlite = ["web_state/job-queue-sqlite", "job_queue_kit/sqlite"]

[dependencies]
config = { workspace = true }
job_queue_kit = { workspace = true }
modrun = { workspace = true }
sched_kit = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
web_state = { workspace = true }
